name: iSafety 채용정보 자동 크롤링 및 게시

on:
  schedule:
    - cron: '0 0 * * *'   # KST 오전 9시
    - cron: '0 6 * * *'   # KST 오후 3시
  workflow_dispatch:

jobs:
  crawl_and_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    env:
      LANG: ko_KR.UTF-8
      LC_ALL: ko_KR.UTF-8
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Korean locale
        run: |
          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen ko_KR.UTF-8

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler & poster
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
        run: python main.py

      - name: Commit posted_jobs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_jobs.json || true
          git diff --staged --quiet || git commit -m "🤖 게시 이력 업데이트"
          git push || true
